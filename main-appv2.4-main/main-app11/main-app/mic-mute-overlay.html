<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
    html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        -webkit-user-select: none;
        user-select: none;
    }

    #badge {
        position: fixed;
        top: 16px;
        left: 16px;
        display: flex;
        align-items: center;
        gap: 6px;
        font-family: 'Segoe UI', sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.04em;
        padding: 6px 12px 6px 10px;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(20, 20, 20, 0.75);
        color: #9ca3af;
        opacity: 0;
        transition: opacity 0.2s ease, background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
    }

    #badge.visible {
        opacity: 1;
    }

    #badge.muted {
        border-color: rgba(248, 113, 113, 0.55);
        background: rgba(60, 20, 20, 0.85);
        color: #f87171;
    }

    #dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #9ca3af;
    }

    #badge.muted #dot {
        background: #f87171;
    }
</style>
</head>
<body>
    <div id="badge"><span id="dot"></span><span id="label">MIC LIVE</span></div>
    <script>
        const badge = document.getElementById('badge');
        const label = document.getElementById('label');
        window.overlayAPI.onState((muted) => {
            badge.classList.add('visible');
            badge.classList.toggle('muted', !!muted);
            label.textContent = muted ? 'MIC MUTED' : 'MIC LIVE';
        });
    </script>
</body>
</html>
